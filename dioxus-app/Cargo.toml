[package]
name = "petri-editor"
version = "0.1.0"
edition = "2021"
description = "A Petri net editor built with Dioxus Desktop"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
unipn = { path = "../UniPN" }
futures-util = "0.3"
quick-xml = "0.36"
rfd = "0.14"
tracing = "0.1"

[dev-dependencies]

[profile.release]
opt-level = 3
